<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="add-circle-outline"></ion-icon> Tambah Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Mata Kuliah" placeholder="Isikan Mata Kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Jam" placeholder="Isikan Jam Kuliah"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Dosen" placeholder="Isikan Nama Dosen"></ion-input>
        </ion-item>
      </ion-list>

      <ion-button>Simpan</ion-button>
    </ion-card-content>
</ion-card>
</ion-content>
